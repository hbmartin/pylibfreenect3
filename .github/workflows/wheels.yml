name: 1.0 quality and release artifacts

on:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: libfreenect2-metal ref (release builds require v0.3.0)
        required: false
        default: cda644a1613156d5e347ce1c1fcf0c6ba06e7bad
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_VERSION: 0.11.30
  CORE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || (startsWith(github.ref, 'refs/tags/') && 'v0.3.0' || 'cda644a1613156d5e347ce1c1fcf0c6ba06e7bad') }}

jobs:
  quality:
    name: Quality, types, metadata, and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build the hardware-free native core
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev libturbojpeg0-dev ninja-build
          cmake -S vendor/libfreenect2-metal -B "$RUNNER_TEMP/core" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/core-prefix" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DBUILD_OPENNI2_DRIVER=OFF -DBUILD_STREAMER_RECORDER=OFF \
            -DBUILD_MEDIAPIPE_DEMO=OFF \
            -DENABLE_CUDA=OFF -DENABLE_METAL=OFF \
            -DENABLE_OPENCL=OFF -DENABLE_OPENGL=OFF
          cmake --build "$RUNNER_TEMP/core" --parallel 2
          cmake --install "$RUNNER_TEMP/core"
      - name: Validate lock and synchronize
        run: uv sync --locked
        env:
          Freenect2_ROOT: ${{ runner.temp }}/core-prefix
      - name: Run fast quality gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run cython-lint --max-line-length 120 src/pylibfreenect3/_native.pyx
          uv run mypy
          uv run pyright --verifytypes pylibfreenect3 --ignoreexternal
          uv run pytest -m "not hardware" --cov=pylibfreenect3 --cov-report=term-missing --cov-fail-under=80
      - name: Check source metadata
        run: |
          uv build --sdist
          uv run twine check dist/*
      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(uv version --short)"

  wheels:
    name: ${{ matrix.name }} wheels
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: wheels-macos-arm64
          - name: manylinux_2_28 x86_64
            os: ubuntu-24.04
            artifact: wheels-manylinux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - name: Verify coordinated core release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(git -C vendor/libfreenect2-metal describe --tags --exact-match)" = v0.3.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build and repair wheels
        run: uv run --no-project --with cibuildwheel==4.1.1 cibuildwheel --output-dir wheelhouse
        env:
          PYLIBF3_REQUIRE_CORE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      - name: Inspect repaired dependency closure
        run: uv run --no-project --with ${{ runner.os == 'macOS' && 'delocate==0.13.0' || 'auditwheel==6.7.0' }} python tools/verify_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Core-independent sdist
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build sdist without libfreenect2
        run: uv build --sdist
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - name: Build a wheel from the sdist
        run: |
          bash tools/build_wheel_dependencies.sh vendor/libfreenect2-metal
          uv build --wheel dist/*.tar.gz --out-dir sdist-wheelhouse
          uv run --isolated --no-project --with sdist-wheelhouse/*.whl python -c "import pylibfreenect3; assert pylibfreenect3.core_api_version() == 3"
        env:
          Freenect2_ROOT: /tmp/pylibfreenect3-wheel-prefix
          PYLIBF3_WHEEL_PREFIX: /tmp/pylibfreenect3-wheel-prefix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sanitizers:
    name: ASan and UBSan ownership gate
    needs: quality
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev libturbojpeg0-dev ninja-build
      - name: Build sanitized core
        run: |
          cmake -S vendor/libfreenect2-metal -B "$RUNNER_TEMP/core-sanitized" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/core-prefix" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=ON \
            -DBUILD_OPENNI2_DRIVER=OFF -DBUILD_STREAMER_RECORDER=OFF \
            -DBUILD_MEDIAPIPE_DEMO=OFF \
            -DENABLE_ASAN=ON -DENABLE_UBSAN=ON \
            -DENABLE_CUDA=OFF -DENABLE_METAL=OFF \
            -DENABLE_OPENCL=OFF -DENABLE_OPENGL=OFF
          cmake --build "$RUNNER_TEMP/core-sanitized" --parallel 2
          cmake --install "$RUNNER_TEMP/core-sanitized"
          ctest --test-dir "$RUNNER_TEMP/core-sanitized" -L unit --output-on-failure --timeout 180
      - name: Run binding ownership and replay tests
        run: |
          sanitizer_flags='-fsanitize=address,undefined -fno-omit-frame-pointer'
          asan_runtime=$(cc -print-file-name=libasan.so)
          CPPFLAGS="$sanitizer_flags" CFLAGS="$sanitizer_flags" \
            CXXFLAGS="$sanitizer_flags" LDFLAGS="$sanitizer_flags" \
            uv sync --locked --no-default-groups --group test
          LD_PRELOAD="$asan_runtime" uv run pytest tests/test_api.py tests/test_recording.py -q
        env:
          Freenect2_ROOT: ${{ runner.temp }}/core-prefix
          LD_LIBRARY_PATH: ${{ runner.temp }}/core-prefix/lib

  prerelease:
    name: CPython 3.15 prerelease smoke
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
      - name: Build native core and smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev libturbojpeg0-dev ninja-build
          cmake -S vendor/libfreenect2-metal -B "$RUNNER_TEMP/core" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/core-prefix" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DBUILD_OPENNI2_DRIVER=OFF -DBUILD_STREAMER_RECORDER=OFF \
            -DBUILD_MEDIAPIPE_DEMO=OFF \
            -DENABLE_CUDA=OFF -DENABLE_METAL=OFF -DENABLE_OPENCL=OFF -DENABLE_OPENGL=OFF
          cmake --build "$RUNNER_TEMP/core" --parallel 2
          cmake --install "$RUNNER_TEMP/core"
          uv sync --python 3.15 --prerelease allow --no-default-groups --group test
          uv run pytest tests/test_api.py -q
        env:
          Freenect2_ROOT: ${{ runner.temp }}/core-prefix

  free_threaded:
    name: CPython 3.14t GIL fallback smoke
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hbmartin/libfreenect2-metal
          ref: ${{ env.CORE_REF }}
          path: vendor/libfreenect2-metal
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14t"
      - name: Verify importing the extension enables the GIL fallback
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev libturbojpeg0-dev ninja-build
          cmake -S vendor/libfreenect2-metal -B "$RUNNER_TEMP/core" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/core-prefix" \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF \
            -DBUILD_OPENNI2_DRIVER=OFF -DBUILD_STREAMER_RECORDER=OFF \
            -DBUILD_MEDIAPIPE_DEMO=OFF \
            -DENABLE_CUDA=OFF -DENABLE_METAL=OFF -DENABLE_OPENCL=OFF -DENABLE_OPENGL=OFF
          cmake --build "$RUNNER_TEMP/core" --parallel 2
          cmake --install "$RUNNER_TEMP/core"
          uv sync --python 3.14t --no-default-groups
          uv run python -c "import sys, pylibfreenect3; assert sys._is_gil_enabled()"
        env:
          Freenect2_ROOT: ${{ runner.temp }}/core-prefix

  docs:
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wheels-manylinux-x86_64
          path: wheelhouse
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build documentation against the repaired wheel
        run: uv run --isolated --no-project --with wheelhouse/*cp314*.whl --with sphinx --with sphinx-rtd-theme sphinx-build -W --keep-going docs docs/_build/html

  hardware:
    if: startsWith(github.ref, 'refs/tags/')
    needs: wheels
    runs-on: [self-hosted, macOS, ARM64, kinect-v2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wheels-macos-arm64
          path: wheelhouse
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Test every macOS wheel on a Kinect v2
        shell: bash
        env:
          PYLIBF3_HARDWARE_SOAK_FRAMES: "900"
          PYLIBF3_HARDWARE_SOAK_MAX_RSS_MB: "128"
        run: |
          set -euo pipefail
          for wheel in wheelhouse/*.whl; do
            tag=$(basename "$wheel" | sed -E 's/.*-(cp3[0-9]+)-.*/\1/')
            version="${tag:2:1}.${tag:3}"
            env -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH -u LIBFREENECT2_PIPELINE \
              uv run --isolated --no-project --python "$version" \
              --with "$wheel" --with pytest \
              pytest tests/test_hardware.py -m hardware -q
          done

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist, sanitizers, prerelease, free_threaded, docs, hardware]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sdist
          path: dist
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Publish through PyPI Trusted Publishing
        run: uv publish dist/*
