[build-system]
requires = ["setuptools>=80", "wheel", "Cython>=3.2.8", "numpy>=2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pylibfreenect3"
version = "0.3.0"
description = "Safe, modern Python bindings for libfreenect2-metal"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Ryuichi Yamamoto"}, {name = "pylibfreenect3 contributors"}]
dependencies = ["numpy>=2.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
build = ["build>=1.2", "cibuildwheel==4.1.1", "delocate==0.13.0; sys_platform == 'darwin'"]
docs = ["sphinx>=8", "sphinx-rtd-theme>=3"]

[project.urls]
Repository = "https://github.com/hbmartin/pylibfreenect3"
Issues = "https://github.com/hbmartin/pylibfreenect3/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pylibfreenect3 = ["py.typed", "licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires a Kinect v2 device"]
addopts = "-ra"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*-win_amd64", "*-musllinux_*", "cp*t-*"]
test-requires = ["pytest>=8"]
test-command = "pytest {project}/tests -m 'not hardware'"
before-all = "bash {project}/tools/build_wheel_dependencies.sh {project}/vendor/libfreenect2-metal"
environment = {LIBFREENECT2_INSTALL_PREFIX = "/tmp/pylibfreenect3-wheel-prefix", PYLIBF3_WHEEL_PREFIX = "/tmp/pylibfreenect3-wheel-prefix", MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.cibuildwheel.macos]
archs = ["arm64"]
repair-wheel-command = "delocate-wheel --require-archs arm64 -w {dest_dir} {wheel}"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
